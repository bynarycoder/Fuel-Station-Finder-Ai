# Alembic configuration for the Fuel Station Finder AI backend.
#
# The actual database URL is injected at runtime from the application settings
# (see backend/alembic/env.py) so this file never contains real credentials.
#
# Run migrations from the `backend/` directory, e.g.:
#   alembic upgrade head
#   alembic downgrade base
#   alembic upgrade head --sql   # offline SQL preview (no DB required)

[alembic]
# Path to the migration scripts, relative to this file.
script_location = alembic

# Make the `app` package importable when running `alembic` from backend/.
prepend_sys_path = .

# Template used to generate new migration files.
output_encoding = utf-8

# revision identifier separator on non-Linux systems.
version_path_separator = os

# Placeholder URL; overridden by env.py -> settings.DATABASE_URL.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/fuel_station_db


[post_write_hooks]
# (none yet)


# Logging configuration consumed by env.py via logging.config.fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
