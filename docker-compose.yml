version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: fuel_station_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fuel_station_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuel_station_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuel_station_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fuel_station_db
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fuel_station_db
      - SUPABASE_URL=https://your-supabase-project.supabase.co
      - SUPABASE_ANON_KEY=your-supabase-anon-key
      - SUPABASE_JWT_SECRET=your-supabase-jwt-signing-secret
      - GEMINI_API_KEY=your-gemini-api-key
      - GROQ_API_KEY=your-groq-api-key
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuel_station_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_SUPABASE_URL=https://your-supabase-project.supabase.co
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=your-supabase-anon-key
    depends_on:
      - backend

volumes:
  db-data:
